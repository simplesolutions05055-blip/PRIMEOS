name: examples-media
on:
  workflow_dispatch:
  push:
    branches: [examples-gallery]
    paths: [tools/examples-media.txt, tools/build-examples.sh, .github/workflows/examples-media.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq webp ffmpeg
      - run: bash tools/build-examples.sh
      - run: |
          git config user.name "examples-bot"
          git config user.email "examples-bot@users.noreply.github.com"
          git add assets/examples
          git diff --cached --quiet || git commit -m "Add compressed example media"
          git push
